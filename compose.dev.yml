# Development database: Postgres 18 + TimescaleDB, the same image as the db
# service in docker-compose.yml. config/dev.exs and config/test.exs connect to
# it on 127.0.0.1:5435 by default (override with PGPORT).
#
#   docker compose -f compose.dev.yml up -d
#
# Its own project name keeps it apart from the production compose project in
# this directory, so `down` here never touches those containers.
name: secant-service-dev

services:
  db:
    image: timescale/timescaledb:2.32.1-pg18
    restart: unless-stopped
    # timescaledb-tune sizes postgresql.conf for the whole host (~7.6 GB
    # shared_buffers); these flags override it to fit a dev database.
    command: >-
      postgres
      -c shared_buffers=512MB
      -c maintenance_work_mem=256MB
      -c effective_cache_size=2GB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - 127.0.0.1:5435:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    name: secant-pgdata-pg18
