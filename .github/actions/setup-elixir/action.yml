name: Set up Elixir
description: Install Erlang/Elixir from .tool-versions, restore caches and fetch deps.

runs:
  using: composite
  steps:
    - name: Set up Erlang/OTP and Elixir
      id: beam
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        version-file: .tool-versions
        version-type: strict

    # deps/ and _build/ are tied to the exact OTP/Elixir versions and mix.lock.
    # The vN prefix drops every old cache, fallbacks included. Bump it when a
    # build has to start fresh without mix.lock changing: v2 because igniter
    # became a test dep, and Mix doesn't recompile the deps it's optional for
    # (ash, ash_oban, ...), whose mix task list `usage_rules.sync` records.
    # ~/.cache/pythonx holds the Python env pythonx builds at compile time from
    # the uv_init config in config/config.exs.
    - name: Restore build cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          deps
          _build
          ~/.cache/pythonx
        key: mix-v2-${{ runner.os }}-${{ env.MIX_ENV }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock', 'config/config.exs') }}
        restore-keys: |
          mix-v2-${{ runner.os }}-${{ env.MIX_ENV }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-

    - name: Fetch dependencies
      shell: bash
      run: mix deps.get

    # pythonx bakes the uv_init config in at compile time, and Mix refuses to
    # run with a build from a different config. A fallback cache may hold one.
    - name: Drop a stale pythonx build
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: mix deps.clean pythonx --build
