name: Release version
description: >-
  Read @version from mix.exs and report whether it still needs a release,
  i.e. has no v<version> tag yet. Needs the repository checked out.

outputs:
  version:
    description: The version in mix.exs.
    value: ${{ steps.version.outputs.version }}
  release:
    description: '"true" when v<version> has no tag yet.'
    value: ${{ steps.version.outputs.release }}

runs:
  using: composite
  steps:
    - name: Compare mix.exs version with the tags
      id: version
      shell: bash
      run: |
        version="$(sed -n 's/^ *@version "\(.*\)"$/\1/p' mix.exs)"
        if [ -z "$version" ]; then
          echo "::error::Could not read @version from mix.exs"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

        # Exit 2 means no such tag. Any other failure (network, auth) must not
        # read as "unreleased", or it would release the version again.
        status=0
        git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || status=$?
        case "$status" in
          0)
            echo "v$version is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
            ;;
          2)
            echo "v$version has no tag yet, releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::Could not list the tags (git ls-remote exited $status)"
            exit 1
            ;;
        esac
