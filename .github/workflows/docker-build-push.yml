name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  # PRs build (but don't push) the image to prove the release still builds.
  # Changes that can't affect the image are skipped.
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "test/**"
      - ".github/dependabot.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/security.yml"
  release:
    types: [published]
  # Allow manual triggering
  workflow_dispatch:
  # The release workflow pushes the image for a new version through this.
  # Releases it creates don't trigger the `release` event above: events from
  # the workflow's own token never start other workflows.
  workflow_call:
    inputs:
      version:
        description: Version to tag the image with, plus `latest`.
        type: string
        required: true

# A new push to a PR supersedes the previous build. Pushes to main and
# releases queue up instead of cancelling, so every tag gets published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SCAN_TAG: secant-service:scan

jobs:
  build-and-push:
    name: Build and Push Docker image
    runs-on: ubuntu-latest
    # Sets the permissions granted to the GITHUB_TOKEN for this job
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}

      # Build into the local Docker daemon first so the image can be scanned
      # before anything is published.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.SCAN_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Report-only: OS/base-image CVEs show up in the Security tab (and the
      # job log) without blocking deploys. Only fixable HIGH/CRITICAL issues.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_TAG }}
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          format: table

      - name: Trivy SARIF report
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_TAG }}
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-image.sarif
          # SARIF output ignores `severity` unless this is set.
          limit-severities-for-sarif: true
          # The previous step already installed Trivy.
          skip-setup-trivy: true

      - name: Upload Trivy report
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # Same inputs as the build step, so this is served from the build cache.
      - name: Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
