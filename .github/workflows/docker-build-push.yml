name: Build and Push Docker Image

on:
  # Pushes the main and sha-<commit> tags, except on a version bump, which
  # the release workflow builds instead (see release-check below).
  push:
    branches: [ "main" ]
  # PRs build (but don't push) the image to prove the release still builds.
  # Changes that can't affect the image are skipped.
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "test/**"
      - ".github/dependabot.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/security.yml"
  release:
    types: [published]
  # Allow manual triggering
  workflow_dispatch:
  # The release workflow pushes the image for a new version through this.
  # Releases it creates don't trigger the `release` event above: events from
  # the workflow's own token never start other workflows.
  workflow_call:
    inputs:
      version:
        description: Version to tag the image with, plus `latest`.
        type: string
        required: true

# A new push to a PR supersedes the previous build. Pushes to main and
# releases queue up instead of cancelling, so every tag gets published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SCAN_TAG: secant-service:scan

jobs:
  # A push to main that bumps the version is built by the release workflow
  # (with the version tags), so building it here too would only race it for
  # the runner and the build cache.
  #
  # Only the push that changes @version is skipped. A later push that lands
  # before the release has tagged still sees an untagged version, but its
  # release run will find the tag and build nothing, so it has to build here.
  # When in doubt this builds: an extra build is harmless, a missing one isn't.
  release-check:
    name: Check for a release commit
    if: github.event_name == 'push' && inputs.version == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.version.outputs.release == 'true' && steps.bump.outputs.bumped == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare mix.exs version with the tags
        id: version
        uses: ./.github/actions/release-version

      - name: Check whether this push changes the version
        id: bump
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git fetch --quiet --depth=1 origin "$PUSH_BEFORE" \
            && before="$(git show FETCH_HEAD:mix.exs | sed -n 's/^ *@version "\(.*\)"$/\1/p')" \
            && [ -n "$before" ] && [ "$before" != "$VERSION" ]; then
            echo "This push changes the version from $before to $VERSION."
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "This push keeps the version (or its parent can't be read)."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build and Push Docker image
    needs: release-check
    # Also runs when release-check is skipped (PRs, releases, manual runs and
    # the release workflow's own call) or fails, whose `skip` then reads empty.
    if: ${{ !cancelled() && needs.release-check.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # Sets the permissions granted to the GITHUB_TOKEN for this job
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}

      # The build cache lives in the registry as the buildcache tag, not in
      # the GitHub Actions cache: an upload only sends the layers the registry
      # doesn't have yet, and the 10 GB Actions cache quota stays free for the
      # mix caches. The image is public, so PR builds read it without a login.
      - name: Build cache reference
        run: echo "CACHE_REF=${REGISTRY}/${GITHUB_REPOSITORY,,}:buildcache" >> "$GITHUB_ENV"

      # Build into the local Docker daemon first so the image can be scanned
      # before anything is published.
      #
      # Only main writes the cache, so a PR can't replace main's layers with
      # its own. A cache that fails to upload doesn't fail the build.
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.SCAN_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref={0},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', env.CACHE_REF) || '' }}

      # Report-only: OS/base-image CVEs show up in the Security tab (and the
      # job log) without blocking deploys. Only fixable HIGH/CRITICAL issues.
      # The image is scanned once; the table and the SARIF report are both
      # converted from that JSON report.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_TAG }}
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          format: json
          output: trivy-image.json

      # The scan step put trivy on the PATH.
      - name: Show Trivy findings
        run: trivy convert --format table trivy-image.json

      - name: Trivy SARIF report
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        # SARIF output lists every severity unless `--severity` is given.
        run: trivy convert --format sarif --severity CRITICAL,HIGH --output trivy-image.sarif trivy-image.json

      - name: Upload Trivy report
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # A release build finishes minutes after its commit landed. If main has
      # moved on by then, a newer build owns the main tag, and pushing it here
      # would move main back to the release commit. A failed lookup keeps it.
      - name: Image tags
        id: tags
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          head="$(git ls-remote origin refs/heads/main | cut -f1)" || head=""
          if [ "$GITHUB_REF" = refs/heads/main ] && [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is at $head now, so the main tag stays where it is."
            TAGS="$(printf '%s\n' "$TAGS" | grep -v ':main$' || true)"
          fi
          {
            echo 'list<<EOF'
            printf '%s\n' "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Same inputs as the build step, so this is served from the builder's
      # local cache. The build step already saved the registry cache.
      - name: Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
