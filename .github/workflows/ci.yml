name: CI

# Lint, compile and test. Mirrors `mix precommit`, but in check-only mode.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs these checks before it releases.
  workflow_call:

# A new push to a PR supersedes the previous run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same image as the db services in docker-compose.yml and compose.dev.yml
      # (Postgres + TimescaleDB), on the port config/test.exs expects. It's
      # built here rather than used as a job service because services can't be
      # built from a Dockerfile. Started now, waited for before the tests.
      - name: Start Postgres with TimescaleDB
        run: |
          docker build -t secant-postgres docker/postgres
          docker run -d --name postgres \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -p 5435:5432 secant-postgres

      - uses: ./.github/actions/setup-elixir

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check for unused locked deps
        run: mix deps.unlock --check-unused

      - name: Check formatting
        run: mix format --check-formatted

      # Only Credo's warning category gates for now; the readability and
      # refactoring backlog can be tightened later.
      - name: Credo
        run: mix credo --only warning --strict

      - name: Check for missing Ash migrations
        run: mix ash.codegen --check

      # The PLTs live in _build, so the build cache keeps them between runs.
      - name: Dialyzer
        run: mix dialyzer --format github

      - name: Wait for Postgres
        run: |
          for _ in $(seq 60); do
            # over TCP: the entrypoint's init-time server only listens on the socket
            docker exec postgres pg_isready -h 127.0.0.1 -U postgres -q && exit 0
            sleep 1
          done
          docker logs postgres
          exit 1

      # The end to end tests run a real SEC node: frappy's simulated cryostat.
      # Same version as in test/support/frappy_server.ex.
      - name: Install frappy
        run: pipx install frappy-core==0.20.9

      - name: Test
        run: mix test
