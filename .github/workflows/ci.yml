name: CI

# Lint, compile and test. Mirrors `mix precommit`, but in check-only mode.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR supersedes the previous run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-elixir

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check for unused locked deps
        run: mix deps.unlock --check-unused

      - name: Check formatting
        run: mix format --check-formatted

      # Only Credo's warning category gates for now; the readability and
      # refactoring backlog can be tightened later.
      - name: Credo
        run: mix credo --only warning --strict

      - name: Check for missing Ash migrations
        run: mix ash.codegen --check

      - name: Test
        run: mix test
